<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <svg class="grafico-svg" width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Retângulo -->
    <rect x="50" y="50" width="150" height="100" 
          fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Círculo -->
    <circle class="icone-svg" cx="300" cy="100" r="50" 
            fill="#e74c3c" opacity="0.8"/>
    
    <!-- Linha -->
    <line x1="50" y1="200" x2="350" y2="200" 
          stroke="#34495e" stroke-width="3"/>
    
    <!-- Texto -->
    <text x="200" y="250" text-anchor="middle" 
          font-family="Arial" font-size="20" fill="#2c3e50">
        Gráfico SVG
    </text>
  </svg>
</body>
</html>
